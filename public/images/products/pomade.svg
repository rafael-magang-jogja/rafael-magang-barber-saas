<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="jarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lidRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="12" fill="#000000" opacity="0.45"/>

  <!-- Jar Body -->
  <rect x="42" y="98" width="116" height="66" rx="14" fill="url(#jarGlow)" stroke="#27272a" stroke-width="2"/>
  <rect x="44" y="100" width="112" height="60" rx="12" fill="none" stroke="#52525b" stroke-width="0.8" opacity="0.4"/>

  <!-- Label on Jar -->
  <rect x="48" y="108" width="104" height="46" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
  <text x="100" y="123" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" letter-spacing="1.5">BARBEROS</text>
  <text x="100" y="135" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">MATTE CLAY</text>
  <text x="100" y="146" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="500" letter-spacing="0.5">HIGH HOLD • 100G</text>

  <!-- Jar Lid Base -->
  <rect x="36" y="80" width="128" height="24" rx="7" fill="url(#goldLid)" stroke="url(#lidRim)" stroke-width="1.5"/>
  <!-- Lid Ridges / Texture -->
  <line x1="42" y1="84" x2="42" y2="100" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
  <line x1="48" y1="84" x2="48" y2="100" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
  <line x1="152" y1="84" x2="152" y2="100" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>
  <line x1="158" y1="84" x2="158" y2="100" stroke="#78350f" stroke-width="1.2" opacity="0.6"/>

  <!-- Lid Dome / Top -->
  <ellipse cx="100" cy="80" rx="64" ry="14" fill="url(#goldLid)" stroke="#d97706" stroke-width="1"/>
  <ellipse cx="100" cy="79" rx="56" ry="10" fill="#fef3c7" opacity="0.35"/>

  <!-- Embossed Logo on Lid -->
  <circle cx="100" cy="79" r="6" fill="#78350f" opacity="0.5"/>
  <path d="M98 76 L102 82 M102 76 L98 82" stroke="#fef3c7" stroke-width="1.2" stroke-linecap="round"/>
</svg>