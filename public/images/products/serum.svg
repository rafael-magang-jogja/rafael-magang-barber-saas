<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="dropperBulb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="dropperCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="176" rx="38" ry="9" fill="#000000" opacity="0.45"/>

  <!-- Bottle Body (Amber Glass) -->
  <rect x="72" y="80" width="56" height="90" rx="14" fill="url(#amberGlass)" stroke="#291203" stroke-width="1.5"/>
  <rect x="75" y="82" width="50" height="84" rx="11" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>

  <!-- Serum Level & Bubble Reflection -->
  <path d="M74 110 Q100 114 126 110 L126 162 Q126 168 120 168 L80 168 Q74 168 74 162 Z" fill="#b45309" opacity="0.4"/>
  <circle cx="86" cy="140" r="2" fill="#fef3c7" opacity="0.4"/>
  <circle cx="112" cy="130" r="1.5" fill="#fef3c7" opacity="0.3"/>

  <!-- Label -->
  <rect x="76" y="98" width="48" height="58" rx="5" fill="#09090b" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="100" y="113" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" letter-spacing="1">BARBEROS</text>
  <text x="100" y="125" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800">BEARD &amp; HAIR</text>
  <text x="100" y="135" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="700">ORGANIC OIL</text>
  <text x="100" y="148" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="500">ARGAN + VIT-E</text>

  <!-- Gold Cap Collar -->
  <rect x="80" y="65" width="40" height="16" rx="3" fill="url(#dropperCap)" stroke="#b45309" stroke-width="1"/>

  <!-- Rubber Bulb -->
  <path d="M88 65 C88 45 92 32 100 32 C108 32 112 45 112 65 Z" fill="url(#dropperBulb)" stroke="#27272a" stroke-width="1"/>

  <!-- Glass Pipette Tip Drop (Hanging) -->
  <circle cx="100" cy="24" r="2.5" fill="#34d399" opacity="0.7"/>
</svg>