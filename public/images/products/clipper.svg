<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="clipperBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
    <linearGradient id="clipperGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="180" rx="36" ry="8" fill="#000000" opacity="0.45"/>

  <!-- Blade Assembly (Top) -->
  <path d="M72 40 L128 40 L124 58 L76 58 Z" fill="url(#bladeSteel)" stroke="#3f3f46" stroke-width="1"/>
  <!-- Teeth of the blade -->
  <line x1="75" y1="36" x2="75" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="80" y1="36" x2="80" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="85" y1="36" x2="85" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="90" y1="36" x2="90" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="95" y1="36" x2="95" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="100" y1="36" x2="100" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="105" y1="36" x2="105" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="110" y1="36" x2="110" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="115" y1="36" x2="115" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="120" y1="36" x2="120" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>
  <line x1="125" y1="36" x2="125" y2="40" stroke="#f4f4f5" stroke-width="1.5"/>

  <!-- Gold Neck Trim -->
  <rect x="76" y="58" width="48" height="6" rx="2" fill="url(#clipperGold)"/>

  <!-- Clipper Body -->
  <path d="M76 64 C74 90 70 140 76 168 C78 174 122 174 124 168 C130 140 126 90 124 64 Z" fill="url(#clipperBody)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Side Adjustment Lever (Gold) -->
  <path d="M71 72 L65 74 L65 82 L71 80 Z" fill="url(#clipperGold)" stroke="#92400e" stroke-width="0.8"/>

  <!-- Power Switch Button -->
  <rect x="94" y="90" width="12" height="20" rx="3" fill="#18181b" stroke="url(#clipperGold)" stroke-width="1"/>
  <circle cx="100" cy="96" r="2.5" fill="#f59e0b"/>

  <!-- Branding Plate -->
  <text x="100" y="130" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" letter-spacing="1">BARBEROS</text>
  <text x="100" y="140" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="700">PRO CLIPPER</text>

  <!-- Battery Indicator LED (Green Dots) -->
  <circle cx="92" cy="158" r="1.5" fill="#10b981"/>
  <circle cx="97" cy="158" r="1.5" fill="#10b981"/>
  <circle cx="103" cy="158" r="1.5" fill="#10b981"/>
  <circle cx="108" cy="158" r="1.5" fill="#10b981"/>
</svg>